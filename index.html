<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    
    <style>
        /* CONFIGURACIÓN DE TU FUENTE EN CATBOX */
        @font-face {
            font-family: 'DeterminationSans';
            src: url('https://files.catbox.moe/z5qzvs.ttf') format('truetype');
        }

        body {
            background-color: #000000;
            margin: 0;
            /* Quitamos overflow:hidden y agregamos 300vh para poder bajar MUCHO más en la página */
            min-height: 300vh; 
            cursor: pointer; 
            font-family: 'DeterminationSans', monospace;
            color: white; 
        }

        /* Contenedor para mantener todo centrado en la primera pantalla visible */
        .pantalla-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            position: relative;
        }

        video {
            /* === VARIABLES DEL VIDEO === */
            --ajustartamañovideo: 45%; 
            --movervideoX: 0px;
            --movervideoY: 0px;

            width: var(--ajustartamañovideo);
            transform: translate(var(--movervideoX), var(--movervideoY));
            transition: transform 1s ease-in-out;
            max-width: 100%;
            max-height: 100vh;
        }

        img {
            /* === VARIABLES DE LA IMAGEN === */
            --moverimagenX: 0px;
            --moverimagenY: 100px; 

            position: absolute; 
            z-index: 10; 
            width: 31%; 

            transform: translate(var(--moverimagenX), var(--moverimagenY));
            transition: transform 1s ease-in-out;
            pointer-events: none;
            display: none; 
        }

        .cuadro {
            /* === VARIABLES DEL CUADRO === */
            --movercuadroX: 0px;
            --movercuadroY: 100px; /* Posición inicial antes de subir */
            
            --anchocuadro: 300px; /* Estirar izquierda/derecha */
            --altocuadro: 150px;  /* Estirar arriba/abajo */
            --escalacuadro: 1;    /* Agrandar tamaño completo (ej: 1.5 o 2) */

            position: absolute;
            z-index: 5; /* Atrás de la imagen, encima del fondo */
            border: 4px solid white;
            background-color: black;
            
            /* Aplicación de tamaño */
            width: var(--anchocuadro);
            height: var(--altocuadro);
            
            /* Aplicación de movimiento y escala */
            transform: translate(var(--movercuadroX), var(--movercuadroY)) scale(var(--escalacuadro));
            transition: transform 1s ease-in-out;
            
            /* Inicia oculto */
            display: none;
        }
    </style>
</head>
<body>

    <!-- Agrupamos todo aquí para que se centre en la parte de arriba de la página -->
    <div class="pantalla-principal">
        
        <!-- El Video -->
        <video id="miVideo">
            <source src="https://files.catbox.moe/qqt4a9.mp4" type="video/mp4">
        </video>

        <!-- El Cuadro Nuevo -->
        <div id="miCuadro" class="cuadro"></div>

        <!-- La Imagen -->
        <img id="miImagen" src="https://files.catbox.moe/f0awab.png" alt="Superposición">

        <!-- El Sonido -->
        <audio id="miSonido">
            <source src="https://files.catbox.moe/yg4k3d.wav" type="audio/wav">
        </audio>

    </div>

    <script>
        const video = document.getElementById('miVideo');
        const imagen = document.getElementById('miImagen');
        const sonido = document.getElementById('miSonido');
        const cuadro = document.getElementById('miCuadro');

        // 1. Al hacer clic, arranca el video
        document.body.addEventListener('click', function() {
            if (video.paused) {
                video.play();
            }
        }, { once: true });

        // 2. Evento al terminar el video
        video.addEventListener('ended', function() {
            
            // Aparece la imagen y reproduce el sonido inmediatamente
            imagen.style.display = 'block'; 
            sonido.play();

            // Contador de 3 segundos
            setTimeout(function() {
                // Mueven el video y la imagen
                video.style.setProperty('--movervideoY', '-149px');
                imagen.style.setProperty('--moverimagenY', '-50px');
                
                // Hace aparecer el cuadro
                cuadro.style.display = 'block';
                
                // Le damos 10 milisegundos de margen para que el navegador 
                // registre que el cuadro apareció antes de animarlo hacia arriba.
                setTimeout(function() {
                    cuadro.style.setProperty('--movercuadroY', '-50px'); // Sube a -50px
                }, 10);
                
            }, 3000); 

        });
    </script>

</body>
</html>
