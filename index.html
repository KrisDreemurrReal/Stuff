<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    
    <style>
        /* FUENTE CON EL NOMBRE EXACTO EN GITHUB */
        @font-face {
            font-family: 'DeterminationSans';
            src: url('DeterminationSansWebRegular-369X.ttf') format('truetype');
        }

        body {
            background-color: #000000;
            margin: 0;
            min-height: 300vh; 
            cursor: pointer; 
            font-family: 'DeterminationSans', monospace;
            color: white; 
        }

        .pantalla-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            position: relative;
        }

        video {
            /* === VARIABLES DEL VIDEO === */
            --ajustartamañovideo: 45%; 
            --movervideoX: 0px;
            --movervideoY: 0px;

            width: var(--ajustartamañovideo);
            transform: translate(var(--movervideoX), var(--movervideoY));
            transition: transform 1s ease-in-out;
            max-width: 100%;
            max-height: 100vh;
        }

        img {
            /* === VARIABLES DE LA IMAGEN === */
            --moverimagenX: 0px;
            --moverimagenY: 100px; 

            position: absolute; 
            z-index: 10; 
            width: 31%; 

            transform: translate(var(--moverimagenX), var(--moverimagenY));
            transition: transform 1s ease-in-out;
            pointer-events: none;
            display: none; 
        }

        .cuadro {
            /* === VARIABLES DEL CUADRO === */
            --movercuadroX: 0px;
            --movercuadroY: 100px; 
            
            --anchocuadro: 300px; 
            --altocuadro: 150px;  
            --escalacuadro: 1;    

            position: absolute;
            z-index: 5; 
            border: 4px solid white;
            background-color: black;
            
            width: var(--anchocuadro);
            height: var(--altocuadro);
            
            transform: translate(var(--movercuadroX), var(--movercuadroY)) scale(var(--escalacuadro));
            transition: transform 1s ease-in-out;
            
            display: none;

            /* Estilos específicos para el contenido de texto del cuadro */
            padding: 20px; 
            box-sizing: border-box; 
            text-align: center; 
        }

        .titulo-cuadro {
            color: #ffff00; /* Amarillo Undertale */
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px; 
        }

        .descripcion-cuadro {
            color: #ffffff; 
            font-size: 16px;
            line-height: 1.4; 
        }

        .descripcion-cuadro b {
            color: #ffffff; 
        }
    </style>
</head>
<body>

    <div class="pantalla-principal">
        
        <!-- El Video -->
        <video id="miVideo">
            <source src="Deltarune.mp4" type="video/mp4">
        </video>

        <!-- El Cuadro -->
        <div id="miCuadro" class="cuadro">
            <div class="titulo-cuadro">Top Cake</div>
            <div class="descripcion-cuadro">
                Un pastel brillante hecho con una antigua receta.
                <br>
                <b>Ingredientes:</b> Harina de trigo, azúcar, huevos, manteca, esencia de vainilla y polvo para hornear.
                <br>
                Se siente cálido al tacto.
            </div>
        </div>

        <!-- La Imagen -->
        <img id="miImagen" src="Restaurant.png" alt="Superposición">

        <!-- El Sonido -->
        <audio id="miSonido">
            <source src="sonido.wav" type="audio/wav">
        </audio>

    </div>

    <script>
        const video = document.getElementById('miVideo');
        const imagen = document.getElementById('miImagen');
        const sonido = document.getElementById('miSonido');
        const cuadro = document.getElementById('miCuadro');

        // 1. Al hacer clic, arranca el video
        document.body.addEventListener('click', function() {
            if (video.paused) {
                video.play();
            }
        }, { once: true });

        // 2. Evento al terminar el video
        video.addEventListener('ended', function() {
            
            imagen.style.display = 'block'; 
            sonido.play();

            // Contador de 3 segundos
            setTimeout(function() {
                video.style.setProperty('--movervideoY', '-149px');
                imagen.style.setProperty('--moverimagenY', '-50px');
                
                cuadro.style.display = 'block';
                
                setTimeout(function() {
                    cuadro.style.setProperty('--movercuadroY', '-50px');
                }, 10);
                
            }, 3000); 

        });
    </script>

</body>
</html>
