<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    
    <style>
        /* FUENTE CON EL NOMBRE EXACTO EN GITHUB */
        @font-face {
            font-family: 'DeterminationSans';
            src: url('DeterminationSansWebRegular-369X.ttf') format('truetype');
        }

        body {
            background-color: #000000;
            margin: 0;
            min-height: 300vh; 
            cursor: pointer; 
            font-family: 'DeterminationSans', monospace;
            color: white; 
        }

        .pantalla-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            position: relative;
        }

        video {
            /* === VARIABLES DEL VIDEO === */
            --ajustartamañovideo: 45%; 
            --movervideoX: 0px;
            --movervideoY: 0px;

            width: var(--ajustartamañovideo);
            transform: translate(var(--movervideoX), var(--movervideoY));
            transition: transform 1s ease-in-out;
            max-width: 100%;
            max-height: 100vh;
        }

        img {
            /* === VARIABLES DE LA IMAGEN === */
            --moverimagenX: 0px;
            --moverimagenY: 100px; 

            position: absolute; 
            z-index: 10; 
            width: 31%; 

            transform: translate(var(--moverimagenX), var(--moverimagenY));
            transition: transform 1s ease-in-out;
            pointer-events: none;
            display: none; 
        }

        .cuadro {
            /* === VARIABLES DEL CUADRO === */
            --movercuadroX: -260px; 
            --movercuadroY: 580px; 
            
            --anchocuadro: 455px;   
            --altocuadro: 355px;    
            --escalacuadro: 1;    

            position: absolute;
            z-index: 5; 
            border: 6px solid white; 
            background-color: black;
            
            width: var(--anchocuadro);
            height: var(--altocuadro);
            
            /* Animación de posición y efecto de desvanecido entrante (Fade-In) */
            transform: translate(var(--movercuadroX), var(--movercuadroY)) scale(var(--escalacuadro));
            opacity: 0; 
            transition: transform 1s ease-in-out, opacity 1.2s ease-in-out;
            
            display: none;

            padding: 20px; 
            box-sizing: border-box; 
            text-align: center; 
        }

        .titulo-cuadro {
            color: #ffff00; 
            font-size: 48px; 
            font-weight: bold;
            margin-bottom: 10px; 
        }

        .descripcion-cuadro {
            color: #ffffff; 
            font-size: 25px; 
            line-height: 1.4; 
        }

        .descripcion-cuadro b {
            color: #ffffff; 
        }

        /* === ESTILOS DEL PRECIO === */
        .precio-cuadro {
            /* === VARIABLES PARA MOVER EL PRECIO === */
            --moverprecioX: 270px;  /* Mueve hacia los lados */
            --moverprecioY: 270px;  /* Mueve hacia arriba y abajo */
            --rotacionprecio: -30deg; /* -30deg lo inclina a la izquierda */

            position: absolute;
            top: 0;
            left: 0;
            color: #00ff00; /* Verde brillante */
            font-size: 35px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000; /* Sombra negra para que resalte */
            
            /* Aplica la posición y la rotación */
            transform: translate(var(--moverprecioX), var(--moverprecioY)) rotate(var(--rotacionprecio));
            z-index: 10; 
            pointer-events: none; /* Para que no estorbe si hacés clic cerca */
        }

        /* === ESTILOS DEL BOTÓN === */
        .boton-fotos {
            /* === VARIABLE PARA MOVER EL BOTÓN EN Y === */
            --moverbotonY: 0px; 

            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: black;
            color: white;
            border: 4px solid white;
            font-family: 'DeterminationSans', monospace;
            font-size: 25px;
            text-decoration: none;
            cursor: pointer;
            
            transform: translateY(var(--moverbotonY));
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .boton-fotos:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

    <div class="pantalla-principal">
        
        <!-- El Video -->
        <video id="miVideo">
            <source src="Deltarune.mp4" type="video/mp4">
        </video>

        <!-- El Cuadro -->
        <div id="miCuadro" class="cuadro">
            
            <!-- Etiqueta del Precio -->
            <div class="precio-cuadro">$50000 ARS</div>

            <div class="titulo-cuadro">Top Cake</div>
            <div class="descripcion-cuadro">
                El resultado de varios dias de esfuerzo, una torta de alta calidad.
                <br><br>
                <b>Ingredientes:</b> Harina de trigo, azúcar, huevos, manteca, esencia de vainilla y polvo para hornear.
                <br><br>
                <!-- El Botón que abre la imagen -->
                <a href="cake.png" target="_blank" class="boton-fotos">Ver fotos del producto</a>
            </div>
        </div>

        <!-- La Imagen -->
        <img id="miImagen" src="Restaurant.png" alt="Superposición">

        <!-- El Sonido -->
        <audio id="miSonido">
            <source src="sonido.wav" type="audio/wav">
        </audio>

    </div>

    <script>
        const video = document.getElementById('miVideo');
        const imagen = document.getElementById('miImagen');
        const sonido = document.getElementById('miSonido');
        const cuadro = document.getElementById('miCuadro');

        // 1. Al hacer clic, arranca el video
        document.body.addEventListener('click', function() {
            if (video.paused) {
                video.play();
            }
        }, { once: true });

        // 2. Evento al terminar el video
        video.addEventListener('ended', function() {
            
            imagen.style.display = 'block'; 
            sonido.play();

            // Contador de 3 segundos
            setTimeout(function() {
                video.style.setProperty('--movervideoY', '-149px');
                imagen.style.setProperty('--moverimagenY', '-50px');
                
                // Muestra el cuadro en el HTML
                cuadro.style.display = 'block';
                
                // Forzar reflow
                void cuadro.offsetWidth; 
                
                // Activa la subida y el fade-in
                cuadro.style.setProperty('--movercuadroY', '430px');
                cuadro.style.opacity = '1';
                
            }, 3000); 

        });
    </script>

</body>
</html>
